[package]
name = "temporizador"
version = "0.1.0"
edition = "2024"
description = "Temporizadores y alarmas para Windows"

[dependencies]
# GPUI aún no es 1.0: se fija la versión exacta para que una actualización no rompa la build.
gpui-kit = "=0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
futures = "0.3"
raw-window-handle = "0.6"
dirs = "6"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
